name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app_gui.py"
      - "NaverBlogWriter.spec"
      - "requirements-build.txt"
      - "requirements.txt"
      - "config.json"
      - "*.py"
      - ".github/workflows/build-windows-exe.yml"
  pull_request:
    paths:
      - "app_gui.py"
      - "NaverBlogWriter.spec"
      - "requirements-build.txt"
      - "requirements.txt"
      - "config.json"
      - "*.py"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q .

      - name: Build portable Windows app
        shell: pwsh
        run: pyinstaller --noconfirm --clean NaverBlogWriter.spec

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/NaverBlogWriter/NaverBlogWriter.exe")) {
            throw "NaverBlogWriter.exe was not produced"
          }
          Get-Item "dist/NaverBlogWriter/NaverBlogWriter.exe" | Format-List Name,Length,FullName

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          Naver Blog Writer - Windows portable app

          1. Run NaverBlogWriter.exe
          2. Open Settings and enter your OpenCode Go API key
          3. Click Naver Login and sign in once
          4. Enter any topic on the Write tab
          5. Click '글 작성 후 네이버 임시저장'

          Settings, login session, and logs are stored in:
          %LOCALAPPDATA%\NaverBlogWriter

          This app only saves drafts. It does not publish live posts.
          "@ | Set-Content -Encoding UTF8 "dist/NaverBlogWriter/README_FIRST.txt"

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: NaverBlogWriter-Windows
          path: dist/NaverBlogWriter/
          if-no-files-found: error
          retention-days: 30
