name: OpenCode Go Flash Guard

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce Flash-only OpenCode Go policy
        run: python .github/scripts/enforce_opencode_go_flash.py
      - name: Commit automatic policy fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No OpenCode Go model-policy changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: enforce OpenCode Go Flash ceiling"
          git push
